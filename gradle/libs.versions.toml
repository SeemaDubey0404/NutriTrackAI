[versions]
agp = "8.13.2"
kotlin = "2.0.21"

coreKtx = "1.16.0"

lifecycle = "2.9.2"

activityCompose = "1.10.1"

composeBom = "2025.06.01"

navigation = "2.9.0"

hilt = "2.57"

